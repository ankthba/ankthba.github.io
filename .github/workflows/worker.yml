name: Worker

# Deploys the now-playing Worker (.github/worker) and gives it the two
# secrets its cron needs, so none of it needs a laptop. Repository secrets:
#   CLOUDFLARE_API_TOKEN   a Cloudflare token from the "Edit Cloudflare
#                          Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account's id (Workers overview, right side)
#   DISPATCH_TOKEN         a fine-grained GitHub token for this repository
#                          with Actions read and write and nothing else;
#                          it becomes the Worker's GITHUB_TOKEN
#   LISTENING_BUFFER_KEY   any long random string; it becomes the Worker's
#                          LOG_KEY, and the listening Action reads with it
# The Worker's Spotify secrets are set once by .github/listening/auth.mjs
# and left alone here.

on:
  push:
    branches: [main]
    paths:
      - '.github/worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      LISTENING_BUFFER_KEY: ${{ secrets.LISTENING_BUFFER_KEY }}
    defaults:
      run:
        working-directory: .github/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the secrets
        id: ready
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DISPATCH_TOKEN LISTENING_BUFFER_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Not deploying; missing repository secrets:$missing"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.ready.outputs.go == 'true'
        run: npx --yes wrangler@4 deploy

      - name: Secrets
        if: steps.ready.outputs.go == 'true'
        run: |
          printf '%s' "$DISPATCH_TOKEN" | npx --yes wrangler@4 secret put GITHUB_TOKEN
          printf '%s' "$LISTENING_BUFFER_KEY" | npx --yes wrangler@4 secret put LOG_KEY
