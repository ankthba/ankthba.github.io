<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1917" media="(prefers-color-scheme: dark)">
  <script>
    /* Before paint: apply a stored theme choice, and mark the root so
       the colophon toggle is only shown where it can actually work. */
    (function () {
      document.documentElement.classList.add('js');
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
  <title>Resume | Aniketh Bandlamudi</title>
  <meta name="description" content="Resume of Aniketh Bandlamudi.">  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="icon" type="image/jpeg" href="/assets/img/anikethFavicon.jpg">
  <style>
    .resume__frame {
      display: block;
      width: 100%;
      max-width: 44rem;
      height: auto;
      margin-top: var(--space-md);
      border-radius: 4px;
      /* Stays white in both themes on purpose: the SVG is black glyph
         paths on nothing, and a resume should read as a sheet of paper
         whatever the page behind it is doing. */
      background: #fff;
      box-shadow: 0 2px 16px rgba(38, 38, 36, 0.08);
    }
    .resume__download {
      margin-top: var(--space-sm);
    }
    @media (max-width: 768px) {
      .resume__frame { margin-left: auto; margin-right: auto; }
    }
  </style>
</head>
