# The now-playing Worker for aniketh.net. See now.js.
name = "aniketh-now"
main = "now.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Starts the listening Action every fifteen minutes (see scheduled() in
# now.js); GitHub's own schedule for it runs hours late.
[triggers]
crons = ["*/15 * * * *"]

# The one gate to Spotify (see NowPlaying in now.js): a single Durable
# Object, so every copy of the Worker shares its limits.
[[durable_objects.bindings]]
name = "NOW"
class_name = "NowPlaying"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NowPlaying"]

# Keeps the Worker's logs for a few days (Workers & Pages > aniketh-now >
# Logs), so a 429, logged with the calls of the last 24 hours, can be
# traced afterwards; without this they were gone once they'd happened.
[observability]
enabled = true
