  </div>

  <script>
    (function () {
      /* A new order on every load, and always a mix: the planes and the
         rest (landscapes and phone tidbits) are each shuffled, then dealt
         out so every column opens on the two in turn, and the rest are
         spread down it so no stretch is only planes, though they are
         most of the photographs. The
         grid fills its columns top to bottom, so each column is dealt
         its own share. Whatever lands at the top of a column loads first. */
      var grid = document.querySelector('.photos__grid');
      var shuffle = function (list) {
        for (var i = list.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = list[i]; list[i] = list[j]; list[j] = t;
        }
        return list;
      };
      var piles = { plane: [], landscape: [] };
      Array.prototype.forEach.call(grid.children, function (item) {
        (piles[item.getAttribute('data-kind')] || piles.plane).push(item);
      });
      Object.keys(piles).forEach(function (k) { shuffle(piles[k]); });
      var columns = window.matchMedia('(max-width: 47.99rem)').matches ? 2 : 3;
      var order = [], tops = [];
      for (var c = 0; c < columns; c++) {
        // this column's share of each kind
        var share = {};
        Object.keys(piles).forEach(function (k) {
          var n = Math.ceil(piles[k].length / (columns - c));
          share[k] = piles[k].splice(0, n);
        });
        tops.push(order.length);
        // the first rounds take one of each kind in turn; after that the
        // landscapes are spread evenly through the planes, each nudged a
        // little at random, so no stretch of a column is all planes
        for (var round = 0; round < 6; round++) {
          shuffle(['plane', 'landscape']).forEach(function (k) { if (share[k].length) order.push(share[k].shift()); });
        }
        var planes = share.plane, lands = share.landscape, total = planes.length + lands.length;
        var slots = lands.map(function (_, i) { return (i + 0.5 + (Math.random() - 0.5) * 0.6) * total / lands.length; });
        for (var at = 0, li = 0; at < total; at++) {
          if (li < lands.length && (slots[li] <= at + 0.5 || !planes.length)) order.push(lands[li++]);
          else order.push(planes.shift());
        }
      }
      order.forEach(function (item) { grid.appendChild(item); });
      tops.forEach(function (t) {
        order.slice(t, t + 3).forEach(function (item) { item.querySelector('img').removeAttribute('loading'); });
      });

      /* A photograph named in the grid's data-below (and so never on the
         home page either) always sits in the lower half: if the deal left
         it higher, it goes in at random somewhere from three fifths to
         five sixths of the way down, measured where the columns actually
         fall, and again whenever they change. */
      var below = (grid.getAttribute('data-below') || '').split(/\s+/).filter(Boolean);
      var isBelow = function (item) {
        var img = item.querySelector('img');
        return !!img && below.indexOf(img.getAttribute('src').split('/').pop().split(/[-.]/)[0]) > -1;
      };
      var keepBelow = function () {
        Array.prototype.filter.call(grid.children, isBelow).forEach(function (item) {
          for (var tries = 0; tries < 6; tries++) {
            var g = grid.getBoundingClientRect();
            var down = function (el) { return (el.getBoundingClientRect().top - g.top) / g.height; };
            if (down(item) >= 0.58) return;
            var spots = Array.prototype.filter.call(grid.children, function (el) {
              var d = down(el);
              return !isBelow(el) && d >= 0.6 && d <= 0.85;
            });
            if (!spots.length) return;
            grid.insertBefore(item, spots[Math.floor(Math.random() * spots.length)]);
          }
        });
      };
      if (below.length) {
        keepBelow();
        window.matchMedia('(max-width: 47.99rem)').addEventListener('change', keepBelow);
        window.addEventListener('load', keepBelow);
      }

      var lightbox = document.getElementById('lightbox');
      var image = lightbox.querySelector('.lightbox__img');
      var closeButton = lightbox.querySelector('.lightbox__close');
      var lastFocused = null;

      function open(photo) {
        image.src = photo.dataset.full || photo.currentSrc || photo.src;
        image.alt = photo.alt;
        lightbox.hidden = false;
        document.body.style.overflow = 'hidden';
        lastFocused = document.activeElement;
        closeButton.focus();
      }

      function close() {
        lightbox.hidden = true;
        image.removeAttribute('src');
        document.body.style.overflow = '';
        if (lastFocused) lastFocused.focus();
      }

      /* Each photo opens with a click, or with Enter or Space once
         it has focus. */
      document.querySelectorAll('.photo-item img').forEach(function (photo) {
        photo.tabIndex = 0;
        photo.setAttribute('role', 'button');
        photo.setAttribute('aria-label', 'View larger: ' + photo.alt);
        photo.addEventListener('click', function () { open(photo); });
        photo.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            open(photo);
          }
        });
      });
      closeButton.addEventListener('click', close);
      lightbox.addEventListener('click', function (event) {
        if (event.target === lightbox) close();
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && !lightbox.hidden) close();
      });
    })();
  </script>
