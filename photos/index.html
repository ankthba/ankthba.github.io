  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <button class="lightbox__close" type="button">Close</button>
    <img class="lightbox__img" src="" alt="">
  </div>

  <script>
    (function () {
      // Shuffle the grid on every load; eager-load whatever lands on top
      var grid = document.querySelector('.photos__grid');
      var items = Array.prototype.slice.call(grid.children);
      for (var i = items.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = items[i]; items[i] = items[j]; items[j] = tmp;
      }
      items.forEach(function (item) { grid.appendChild(item); });
      items.slice(0, 6).forEach(function (item) {
        item.querySelector('img').removeAttribute('loading');
      });

      var lightbox = document.getElementById('lightbox');
      var image = lightbox.querySelector('.lightbox__img');
      var closeButton = lightbox.querySelector('.lightbox__close');
      var lastFocused = null;

      function open(photo) {
        image.src = photo.dataset.full || photo.currentSrc || photo.src;
        image.alt = photo.alt;
        lightbox.hidden = false;
        document.body.style.overflow = 'hidden';
        lastFocused = document.activeElement;
        closeButton.focus();
      }

      function close() {
        lightbox.hidden = true;
        image.src = '';
        document.body.style.overflow = '';
        if (lastFocused) lastFocused.focus();
      }

      document.querySelectorAll('.photo-item img').forEach(function (photo) {
        photo.addEventListener('click', function () { open(photo); });
      });
      closeButton.addEventListener('click', close);
      lightbox.addEventListener('click', function (event) {
        if (event.target === lightbox) close();
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && !lightbox.hidden) close();
      });
    })();
  </script>
