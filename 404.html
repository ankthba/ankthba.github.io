  <script>
    /* Before paint: apply a stored theme choice, and mark the root so
       the theme control is only shown where it can actually work. */
    (function () {
      document.documentElement.classList.add('js');
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
